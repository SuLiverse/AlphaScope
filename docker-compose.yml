# 研策中枢 AlphaScope Docker Compose (v1.9.51)
# Services: FastAPI API + Vite Frontend; optional Streamlit debug console
#
# Usage:
#   docker compose up -d                       # Start API + product Web UI
#   docker compose --profile debug up -d       # Also start Streamlit (port 8501)
#   docker compose up -d api                   # FastAPI only (port 8000)

services:
  # Optional Streamlit debug console (enable with --profile debug)
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: streamlit
    profiles: ["debug"]
    container_name: alphascope-app
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data
      - ./.env:/app/.env:ro
      - ./config:/app/config:ro
    environment:
      - PYTHONPATH=/app
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 512M
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8501/_stcore/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - alphascope-net

  # FastAPI API Backend (port 8000)
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    container_name: alphascope-api
    # access log 关闭:query-token 兼容期间防止 local_token 落入容器日志
    command: ["python", "-m", "uvicorn", "backend.api.main:app", "--host", "0.0.0.0", "--port", "8000", "--no-access-log"]
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./.env:/app/.env:ro
      - ./config:/app/config:ro
      - runtime-config:/runtime
    environment:
      - PYTHONPATH=/app
      - ALPHASCOPE_RUNTIME_CONFIG_DIR=/runtime
      - VITE_API_BASE_URL=${ALPHASCOPE_PUBLIC_API_BASE_URL:-http://localhost:8000}
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 512M
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - alphascope-net

  # Vite Frontend (port 3000)
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8000
    container_name: alphascope-web
    ports:
      - "3000:3000"
    volumes:
      - runtime-config:/runtime:ro
    command:
      - sh
      - -c
      - ln -sf /runtime/runtime-config.js /app/dist/runtime-config.js && npm run preview -- --host 0.0.0.0 --port 3000
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 128M
    networks:
      - alphascope-net

networks:
  alphascope-net:
    driver: bridge

volumes:
  runtime-config:
