name: Windows Installer

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-installer:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --prefer-binary -r requirements-api.txt pyinstaller

      - name: Install web dependencies
        working-directory: apps/web
        run: npm ci

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build portable app and installer
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"
        run: |
          if (-not (Test-Path "seed/ai_finance.db")) {
            throw "Tracked seed/ai_finance.db is required for the zero-key demo release."
          }
          python build.py --installer --zip
          if (-not (Test-Path "dist/AlphaScope/data/db/ai_finance.db")) {
            throw "Seed database was not included in the portable build."
          }

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: AlphaScope-Windows-Installer
          path: |
            installer/installer-output/AlphaScope-Setup-*.exe
            dist/AlphaScope-portable.zip

      - name: Attach assets to GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $releaseReady = $false
          for ($attempt = 1; $attempt -le 30; $attempt++) {
            gh release view "${env:GITHUB_REF_NAME}" *> $null
            if ($LASTEXITCODE -eq 0) {
              $releaseReady = $true
              break
            }
            Start-Sleep -Seconds 10
          }
          if (-not $releaseReady) {
            throw "Release ${env:GITHUB_REF_NAME} was not created within 5 minutes."
          }
          gh release upload "${env:GITHUB_REF_NAME}" installer/installer-output/AlphaScope-Setup-*.exe --clobber
          gh release upload "${env:GITHUB_REF_NAME}" dist/AlphaScope-portable.zip --clobber
